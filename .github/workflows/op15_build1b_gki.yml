name: OnePlus 15 Build 1B — GKI base kernel

# Build 1B: Official OnePlus 15 common kernel source, gki_defconfig.
# Pure GKI Image — no appended DTB, no Bazel, no oplus wrapper.
# Stock DTB preserved during AnyKernel3/magiskboot repack.
# Method: verified against Numbersf, cctv18, WildKernels (all use this path).
# Toolchain: clang r536225 + Rust 1.82.0 + build-tools (same as cctv18).

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Disk cleanup
        run: |
          echo "=== Before cleanup ==="
          df -h /
          mkdir -p /tmp/.background_trash/{1..10}
          safe_mv() { [ -e "$1" ] && sudo mv "$1" "$2"; }
          export -f safe_mv
          safe_mv /usr/share/dotnet /tmp/.background_trash/1 &
          safe_mv /usr/local/lib/android /tmp/.background_trash/2 &
          safe_mv /opt/ghc /tmp/.background_trash/3 &
          safe_mv /opt/hostedtoolcache/CodeQL /tmp/.background_trash/4 &
          safe_mv /usr/local/share/chromium /tmp/.background_trash/5 &
          safe_mv /usr/local/share/powershell /tmp/.background_trash/6 &
          safe_mv /opt/hostedtoolcache/go /tmp/.background_trash/7 &
          safe_mv /opt/hostedtoolcache/PyPy /tmp/.background_trash/8 &
          safe_mv /opt/hostedtoolcache/node /tmp/.background_trash/9 &
          sudo bash -c 'mv /usr/local/julia* /tmp/.background_trash/10 2>/dev/null || true' &
          wait
          (
            sudo nice -n 19 ionice -c 3 rm -rf /tmp/.background_trash
            sudo apt-get purge -y firefox google-chrome-stable microsoft-edge-stable > /dev/null 2>&1 || true
            sudo docker image prune --all --force > /dev/null 2>&1 || true
          ) > /dev/null 2>&1 &
          disown
          echo "=== After cleanup ==="
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl flex git \
            kmod libelf-dev libssl-dev lz4 python3 python-is-python3 \
            zip zstd rsync ccache aria2 pigz pahole

      - name: Download common kernel source
        run: |
          mkdir -p kernel_workspace && cd kernel_workspace

          echo "=== Downloading OnePlus 15 common kernel source ==="
          BRANCH="oneplus/sm8850_b_16.0.0_oneplus_15"
          REPO="OnePlusOSS/android_kernel_common_oneplus_sm8850"
          URL="https://github.com/${REPO}/archive/refs/heads/${BRANCH}.tar.gz"

          # Record the source commit SHA for reproducibility
          SOURCE_SHA=$(curl -sH "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${REPO}/commits?sha=${BRANCH}&per_page=1" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['sha'])")
          echo "Source commit: $SOURCE_SHA"
          echo "SOURCE_SHA=$SOURCE_SHA" >> $GITHUB_ENV

          # Download by exact commit SHA, not branch (prevents race if branch moves)
          aria2c -x16 -s16 -k1M --retry-wait=5 --max-tries=10 \
            --summary-interval=0 \
            --header='User-Agent: Mozilla/5.0' \
            -o source.tar.gz "https://github.com/${REPO}/archive/${SOURCE_SHA}.tar.gz"

          mkdir -p common
          tar -I 'pigz -p $(nproc)' -x -f source.tar.gz -C common --strip-components=1
          rm source.tar.gz

          ls common/arch/arm64/configs/gki_defconfig && echo "gki_defconfig: present"
          df -h /

      - name: Download toolchains (clang r536225 + Rust + build-tools)
        run: |
          cd kernel_workspace

          # Same toolchain set cctv18 uses — clang r536225, Rust 1.82.0, build-tools
          TOOLCHAIN_BASE="https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225"

          echo "=== Downloading clang r536225 ==="
          aria2c -x16 -s16 -k1M --retry-wait=5 --max-tries=5 \
            --summary-interval=0 -o clang.zip "${TOOLCHAIN_BASE}/clang-r536225.zip"
          mkdir -p clang19
          unzip -q clang.zip -d clang19
          rm clang.zip

          echo "=== Downloading Rust 1.82.0 ==="
          aria2c -x16 -s16 -k1M --retry-wait=5 --max-tries=5 \
            --summary-interval=0 -o rust.zip "${TOOLCHAIN_BASE}/rust.zip"
          mkdir -p rust
          unzip -q rust.zip -d rust
          rm rust.zip

          echo "=== Downloading build-tools ==="
          aria2c -x16 -s16 -k1M --retry-wait=5 --max-tries=5 \
            --summary-interval=0 -o build-tools.zip "${TOOLCHAIN_BASE}/build-tools.zip"
          unzip -q build-tools.zip
          rm build-tools.zip

          echo "=== Verify toolchains ==="
          CLANG_BIN=$(find clang19 -name 'clang' -path '*/bin/clang' | head -1)
          echo "Clang binary: $CLANG_BIN"
          $CLANG_BIN --version | head -3

          RUSTC_BIN=$(find rust -name 'rustc' -path '*/bin/rustc' | head -1)
          echo "Rustc binary: $RUSTC_BIN"
          $RUSTC_BIN --version

          BINDGEN_BIN=$(find rust build-tools clang19 -name 'bindgen' 2>/dev/null | head -1)
          [ -z "$BINDGEN_BIN" ] && BINDGEN_BIN=$(which bindgen 2>/dev/null || true)
          echo "Bindgen: ${BINDGEN_BIN:-NOT FOUND}"

          PAHOLE_BIN=$(find build-tools -name 'pahole' 2>/dev/null | head -1)
          [ -z "$PAHOLE_BIN" ] && PAHOLE_BIN=$(which pahole 2>/dev/null || true)
          echo "Pahole: $PAHOLE_BIN"

          # Export paths for build step
          CLANG_DIR=$(dirname "$CLANG_BIN")
          RUST_DIR=$(dirname "$RUSTC_BIN")
          BUILDTOOLS_DIR=$(find . -path '*/build-tools/bin' -type d | head -1 || echo "")
          echo "CLANG_DIR=$CLANG_DIR" >> $GITHUB_ENV
          echo "RUST_DIR=$RUST_DIR" >> $GITHUB_ENV
          echo "BUILDTOOLS_DIR=$BUILDTOOLS_DIR" >> $GITHUB_ENV
          echo "BINDGEN_BIN=$BINDGEN_BIN" >> $GITHUB_ENV

          df -h /

      - name: Prepare build config
        run: |
          cd kernel_workspace/common

          # Disable check_defconfig (all community builders do this)
          if grep -q 'check_defconfig' build.config.gki 2>/dev/null; then
            sed -i 's/check_defconfig//' build.config.gki
            echo "Disabled check_defconfig in build.config.gki"
          fi

          echo "=== gki_defconfig key entries ==="
          grep -E 'CONFIG_LOCALVERSION|CONFIG_RUST|CONFIG_MODULES|CONFIG_MODVERSIONS' arch/arm64/configs/gki_defconfig

      - name: Build kernel (GKI make)
        run: |
          cd kernel_workspace

          # Set up toolchain paths (detect actual bin dirs)
          export PATH="${CLANG_DIR}:${RUST_DIR}:${BUILDTOOLS_DIR}:${PATH}"
          export LIBCLANG_PATH="${CLANG_DIR}/../lib"

          cd common

          echo "=== Toolchain verification ==="
          clang --version | head -1
          rustc --version 2>/dev/null || echo "WARN: rustc not in PATH"
          bindgen --version 2>/dev/null || echo "WARN: bindgen not in PATH"
          pahole --version 2>/dev/null || echo "WARN: pahole not in PATH"

          echo ""
          echo "=== Build start: $(date -u) ==="

          WORKSPACE="$(pwd)"

          # Path remap flags (used by Numbersf/cctv18/WildKernels for 6.12 + Rust/KMI)
          KCFLAGS="-fdebug-prefix-map=${WORKSPACE}=. -fmacro-prefix-map=${WORKSPACE}=. -ffile-prefix-map=${WORKSPACE}=. -no-canonical-prefixes -Wno-error -D__ANDROID_COMMON_KERNEL__"
          KCPPFLAGS="-D__ANDROID_COMMON_KERNEL__"

          MAKE_ARGS=(
            LLVM=1
            LLVM_IAS=1
            ARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu-
            CC="clang"
            LD="ld.lld"
            AR="llvm-ar"
            NM="llvm-nm"
            OBJCOPY="llvm-objcopy"
            OBJDUMP="llvm-objdump"
            STRIP="llvm-strip"
            KCFLAGS="$KCFLAGS"
            KCPPFLAGS="$KCPPFLAGS"
          )

          # Add Rust/bindgen if available
          if command -v rustc &>/dev/null; then
            MAKE_ARGS+=(RUSTC="$(which rustc)")
          fi
          if [ -n "$BINDGEN_BIN" ] && [ -f "$BINDGEN_BIN" ]; then
            MAKE_ARGS+=(BINDGEN="$BINDGEN_BIN")
          fi
          if command -v pahole &>/dev/null; then
            MAKE_ARGS+=(PAHOLE="$(which pahole)")
          fi

          # Generate config
          make -j$(nproc) O=out "${MAKE_ARGS[@]}" gki_defconfig
          make -j$(nproc) O=out "${MAKE_ARGS[@]}" olddefconfig

          # Check kernelrelease BEFORE building
          KERNELRELEASE=$(make -s O=out "${MAKE_ARGS[@]}" kernelrelease)
          echo ""
          echo "=== Kernel release: $KERNELRELEASE ==="
          echo "=== Stock .300:     6.12.23-android16-5-gb2a876903b49-ab14541642-4k ==="
          echo "KERNELRELEASE=$KERNELRELEASE" >> $GITHUB_ENV
          echo ""

          # Build kernel Image
          make -j$(nproc) O=out "${MAKE_ARGS[@]}" Image 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "=== Build exit code: $BUILD_EXIT ==="
          echo "=== Build end: $(date -u) ==="

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "=== BUILD FAILED ==="
            grep -i "error:" build.log | tail -30
            exit 1
          fi

          # Verify Image exists and is pure (no appended DTB)
          IMAGE="out/arch/arm64/boot/Image"
          ls -la "$IMAGE" || { echo "ERROR: Image not produced"; exit 1; }
          IMAGE_SIZE=$(stat -c%s "$IMAGE")
          echo ""
          echo "=== Image details ==="
          echo "Size: $IMAGE_SIZE bytes"
          file "$IMAGE"
          sha256sum "$IMAGE"

          # Verify no DTB appended (GKI Image should be ~20MB, not ~40MB)
          if [ "$IMAGE_SIZE" -gt 30000000 ]; then
            echo "WARNING: Image is $IMAGE_SIZE bytes — may have appended DTB"
            echo "Stock GKI kernel is ~20MB. Check if this is composite."
          else
            echo "Image size looks correct for pure GKI kernel"
          fi
          echo ""
          df -h /

      - name: Collect build artifacts
        run: |
          cd kernel_workspace/common
          mkdir -p ../../artifacts

          # Kernel Image
          cp out/arch/arm64/boot/Image ../../artifacts/
          echo "Image: $(stat -c%s ../../artifacts/Image) bytes"

          # Built config
          cp out/.config ../../artifacts/kernel_built_config

          echo "=== Config verification ==="
          grep -E '^CONFIG_LOCALVERSION' out/.config || echo "LOCALVERSION not set"
          grep -E '^CONFIG_MODULES=|^CONFIG_MODVERSIONS=' out/.config || true
          grep -E '^CONFIG_RUST=' out/.config || echo "RUST not set"
          echo "--- Verify NO root framework ---"
          if grep -qE 'CONFIG_KSU|CONFIG_KPM|SUSFS' out/.config; then
            echo "FATAL: root framework config found in Build 1B"
            grep -E 'CONFIG_KSU|CONFIG_KPM|SUSFS' out/.config
            exit 1
          fi
          echo "Clean: no root framework in config"

          # Module.symvers
          cp out/Module.symvers ../../artifacts/ 2>/dev/null || true

          # Build log tail
          tail -500 build.log > ../../artifacts/build_tail.log

          # Record build metadata
          cat > ../../artifacts/BUILD_INFO.txt << EOF
          Source: OnePlusOSS/android_kernel_common_oneplus_sm8850
          Branch: oneplus/sm8850_b_16.0.0_oneplus_15
          Commit: ${{ env.SOURCE_SHA }}
          Kernelrelease: ${{ env.KERNELRELEASE }}
          Stock .300 release: 6.12.23-android16-5-gb2a876903b49-ab14541642-4k
          Clang: r536225 (from cctv18 toolchain release)
          Build date: $(date -u)
          Build method: make gki_defconfig + make Image (GKI path)
          EOF

          # Hash everything
          cd ../../artifacts
          sha256sum * | tee SHA256SUMS.txt
          echo ""
          ls -la

      - name: Upload Build 1B artifacts
        uses: actions/upload-artifact@v4
        with:
          name: op15-build1b-gki-kernel
          path: artifacts/*
          retention-days: 30
          if-no-files-found: error

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: op15-build1b-full-log
          path: kernel_workspace/common/build.log
          retention-days: 14
          if-no-files-found: warn
