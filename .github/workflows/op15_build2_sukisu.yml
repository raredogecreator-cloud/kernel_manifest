name: OnePlus 15 Build 2 — SukiSU Ultra + SUSFS

# Build 2: SukiSU Ultra (builtin) + SUSFS v2.2.0 on exact Build 1 base.
# Same source, toolchain, build method as Build 1B.
# No KPM, no BBG, no stealth patches, no performance tuning.
# OP15-specific: bouteillepleine recovery bootloop fix for sus_mount.

on:
  workflow_dispatch:

env:
  SOURCE_REPO: OnePlusOSS/android_kernel_common_oneplus_sm8850
  SOURCE_SHA: d9053b907db4bb5da938e9cf947d0ae32302ceaf
  SOURCE_BRANCH: oneplus/sm8850_b_16.0.0_oneplus_15
  TOOLCHAIN_BASE: https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225
  SUKISU_SHA: 7cd3be6187d464784ba96644b44fad085477d753
  SUSFS_SHA: 72bdce7ce2de8189efb227c6cefbc578a9efd479

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Disk cleanup
        run: |
          set -euo pipefail
          df -h /
          mkdir -p /tmp/.background_trash/{1..10}
          safe_mv() { [ -e "$1" ] && sudo mv "$1" "$2" || true; }
          export -f safe_mv
          safe_mv /usr/share/dotnet /tmp/.background_trash/1 &
          safe_mv /usr/local/lib/android /tmp/.background_trash/2 &
          safe_mv /opt/ghc /tmp/.background_trash/3 &
          safe_mv /opt/hostedtoolcache/CodeQL /tmp/.background_trash/4 &
          safe_mv /usr/local/share/chromium /tmp/.background_trash/5 &
          safe_mv /usr/local/share/powershell /tmp/.background_trash/6 &
          safe_mv /opt/hostedtoolcache/go /tmp/.background_trash/7 &
          safe_mv /opt/hostedtoolcache/PyPy /tmp/.background_trash/8 &
          safe_mv /opt/hostedtoolcache/node /tmp/.background_trash/9 &
          sudo bash -c 'mv /usr/local/julia* /tmp/.background_trash/10 2>/dev/null || true' &
          wait
          sudo nice -n 19 ionice -c 3 rm -rf /tmp/.background_trash &
          disown
          df -h /

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl flex git \
            kmod libelf-dev libssl-dev lz4 python3 python-is-python3 \
            zip zstd rsync ccache aria2 pigz pahole libdw-dev elfutils dwarves

      - name: Download source and toolchains
        run: |
          set -euo pipefail
          mkdir -p kernel_workspace
          cd kernel_workspace
          WORKDIR="$(pwd)"
          echo "WORKDIR=$WORKDIR" >> "$GITHUB_ENV"

          echo "=== Source: $SOURCE_REPO @ $SOURCE_SHA ==="

          aria2c -x16 -s16 -k1M --retry-wait=5 --max-tries=10 \
            --summary-interval=0 --header='User-Agent: Mozilla/5.0' \
            -o source.tar.gz "https://github.com/${SOURCE_REPO}/archive/${SOURCE_SHA}.tar.gz" &
          PID_SRC=$!

          aria2c -x16 -s16 -k1M --retry-wait=5 --max-tries=5 \
            --summary-interval=0 -o clang.zip "${TOOLCHAIN_BASE}/clang-r536225.zip" &
          PID_CLG=$!

          aria2c -x16 -s16 -k1M --retry-wait=5 --max-tries=5 \
            --summary-interval=0 -o rust.zip "${TOOLCHAIN_BASE}/rust.zip" &
          PID_RST=$!

          aria2c -x16 -s16 -k1M --retry-wait=5 --max-tries=5 \
            --summary-interval=0 -o build-tools.zip "${TOOLCHAIN_BASE}/build-tools.zip" &
          PID_BT=$!

          wait $PID_SRC || { echo "FATAL: source download failed"; exit 1; }
          wait $PID_CLG || { echo "FATAL: clang download failed"; exit 1; }
          wait $PID_RST || { echo "FATAL: rust download failed"; exit 1; }
          wait $PID_BT  || { echo "FATAL: build-tools download failed"; exit 1; }
          echo "All downloads complete"

          echo "Extracting source..."
          mkdir -p common
          tar -I "pigz -p $(nproc)" -x -f source.tar.gz -C common --strip-components=1
          rm source.tar.gz

          echo "Extracting clang..."
          mkdir -p clang19
          unzip -q clang.zip -d clang19
          rm clang.zip

          echo "Extracting rust..."
          mkdir -p rust
          unzip -q rust.zip -d rust
          rm rust.zip

          echo "Extracting build-tools..."
          unzip -q build-tools.zip
          rm build-tools.zip

          test -f common/arch/arm64/configs/gki_defconfig || { echo "FATAL: gki_defconfig missing"; exit 1; }
          test -f common/Makefile || { echo "FATAL: kernel Makefile missing"; exit 1; }

          export PATH="$WORKDIR/clang19/bin:$WORKDIR/build-tools/bin:$WORKDIR/rust/bin:$PATH"
          echo "PATH=$WORKDIR/clang19/bin:$WORKDIR/build-tools/bin:$WORKDIR/rust/bin:$PATH" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$WORKDIR/clang19/lib" >> "$GITHUB_ENV"

          echo "=== Toolchain verification ==="
          command -v clang   && clang --version | head -1   || { echo "FATAL: clang missing"; exit 1; }
          command -v ld.lld                                 || { echo "FATAL: ld.lld missing"; exit 1; }
          command -v rustc   && rustc --version             || { echo "FATAL: rustc missing"; exit 1; }
          command -v bindgen && bindgen --version           || { echo "FATAL: bindgen missing"; exit 1; }
          command -v pahole  && pahole --version            || echo "WARN: pahole from system"
          test -d "$WORKDIR/clang19/lib"                    || { echo "FATAL: LIBCLANG_PATH missing"; exit 1; }

          df -h /

      - name: Integrate SukiSU Ultra + SUSFS
        run: |
          set -euo pipefail
          cd "$WORKDIR"

          # --- 1. Init git in common/ (setup.sh needs git for version detection) ---
          cd common
          git init -q
          git -c user.email=ci@build -c user.name=CI commit -q --allow-empty -m "source"
          cd "$WORKDIR"

          # --- 2. SukiSU Ultra (pinned commit on builtin branch) ---
          echo "=== Installing SukiSU Ultra (builtin @ $SUKISU_SHA) ==="
          cd common
          curl --fail --retry 3 --retry-delay 5 -LSs \
            "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/$SUKISU_SHA/kernel/setup.sh" \
            | bash -s "$SUKISU_SHA"

          test -d KernelSU || { echo "FATAL: KernelSU directory not created by setup.sh"; exit 1; }

          # Verify pinned commit — fail hard if wrong
          ACTUAL_SHA=$(cd KernelSU && git rev-parse HEAD)
          echo "SukiSU Ultra installed @ $ACTUAL_SHA"
          if [ "$ACTUAL_SHA" != "$SUKISU_SHA" ]; then
            echo "setup.sh checked out $ACTUAL_SHA instead of pinned $SUKISU_SHA — forcing..."
            (cd KernelSU && git fetch origin "$SUKISU_SHA" && git checkout "$SUKISU_SHA")
            ACTUAL_SHA=$(cd KernelSU && git rev-parse HEAD)
            if [ "$ACTUAL_SHA" != "$SUKISU_SHA" ]; then
              echo "FATAL: SukiSU pin mismatch — expected $SUKISU_SHA got $ACTUAL_SHA"
              exit 1
            fi
          fi

          KSU_VERSION=$(cd KernelSU && git rev-list --count HEAD 2>/dev/null || echo "unknown")
          echo "KSU commit count: $KSU_VERSION"
          cd "$WORKDIR"

          # --- 3. SUSFS (pinned commit on gki-android16-6.12) ---
          echo "=== Cloning SUSFS @ $SUSFS_SHA ==="
          git clone https://gitlab.com/simonpunk/susfs4ksu.git \
            -b gki-android16-6.12 susfs4ksu
          (cd susfs4ksu && git checkout "$SUSFS_SHA")

          ACTUAL_SUSFS=$(cd susfs4ksu && git rev-parse HEAD)
          echo "SUSFS commit: $ACTUAL_SUSFS"
          if [ "$ACTUAL_SUSFS" != "$SUSFS_SHA" ]; then
            echo "FATAL: SUSFS checkout mismatch: expected $SUSFS_SHA got $ACTUAL_SUSFS"
            exit 1
          fi

          # Verify patch file exists before copying
          test -f susfs4ksu/kernel_patches/50_add_susfs_in_gki-android16-6.12.patch \
            || { echo "FATAL: SUSFS patch not found"; ls -la susfs4ksu/kernel_patches/; exit 1; }
          test -f susfs4ksu/kernel_patches/fs/susfs.c \
            || { echo "FATAL: susfs.c not found"; exit 1; }
          test -f susfs4ksu/kernel_patches/include/linux/susfs.h \
            || { echo "FATAL: susfs.h not found"; exit 1; }

          # --- 3b. Apply SUSFS KernelSU integration patch ---
          # Adds SUSFS Kconfig entries to KernelSU and removes lsm_hook.o from Kbuild
          # (SUSFS uses kprobes, not LSM hooks — avoids 6.12 struct lsm_id issue)
          echo "=== Applying 10_enable_susfs_for_ksu.patch to KernelSU ==="
          test -f susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch \
            || { echo "FATAL: 10_enable_susfs_for_ksu.patch not found"; exit 1; }
          cp susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch common/KernelSU/
          cd common/KernelSU
          if ! patch -p1 < 10_enable_susfs_for_ksu.patch; then
            echo "FATAL: KernelSU SUSFS integration patch failed"
            find . -name "*.rej" -exec echo "--- {} ---" \; -exec cat {} \;
            exit 1
          fi
          echo "KernelSU SUSFS integration patch applied"
          rm -f 10_enable_susfs_for_ksu.patch
          cd "$WORKDIR"

          # --- 3c. Apply SUSFS kernel-level patch ---
          cp susfs4ksu/kernel_patches/fs/susfs.c common/fs/
          cp susfs4ksu/kernel_patches/include/linux/susfs.h common/include/linux/
          cp susfs4ksu/kernel_patches/include/linux/susfs_def.h common/include/linux/
          cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-android16-6.12.patch common/

          echo "=== Applying SUSFS kernel patch ==="
          cd common
          if ! patch -p1 < 50_add_susfs_in_gki-android16-6.12.patch; then
            echo "FATAL: SUSFS kernel patch failed"
            find . -name "*.rej" -exec echo "--- {} ---" \; -exec cat {} \;
            exit 1
          fi
          echo "SUSFS kernel patch applied"
          rm -f 50_add_susfs_in_gki-android16-6.12.patch
          cd "$WORKDIR"

          # --- 4. OP15 recovery bootloop fix (from bouteillepleine) ---
          # Source: bouteillepleine OP15 workflow, fix_op15_recovery_bootloop_sus_mount()
          # Adds null-pointer and self-parent guards to SUSFS mnt_parent traversal.
          # Only applied if the exact unguarded pattern is found in SUSFS-patched source.
          echo "=== OP15 recovery bootloop fix (conditional) ==="
          cd common
          python3 << 'PYEOF'
          import os

          def check_and_fix(filepath, old, new, description):
              if not os.path.isfile(filepath):
                  print(f"  SKIP {filepath}: file not present")
                  return
              with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()
              count = content.count(old)
              if count == 0:
                  print(f"  SKIP {filepath}: pattern not found (already fixed or not applicable)")
                  return
              if count > 1:
                  print(f"  SKIP {filepath}: pattern found {count} times (ambiguous, refusing)")
                  return
              content = content.replace(old, new, 1)
              with open(filepath, 'w', encoding='utf-8') as f:
                  f.write(content)
              print(f"  APPLIED {filepath}: {description}")

          old_loop = 'for (; mnt->mnt_id >= DEFAULT_KSU_MNT_ID; mnt = mnt->mnt_parent) { }'
          new_loop = 'for (; mnt->mnt_id >= DEFAULT_KSU_MNT_ID && mnt->mnt_parent && mnt != mnt->mnt_parent; mnt = mnt->mnt_parent) { }'

          for f in ['./fs/statfs.c', './fs/proc/fd.c']:
              check_and_fix(f, old_loop, new_loop, "mnt_parent traversal guard")

          old_statfs = 'error = statfs_by_dentry(mnt->mnt.mnt_root, buf);'
          new_statfs = 'if (likely(susfs_is_current_proc_umounted_app())) { error = statfs_by_dentry(mnt->mnt.mnt_root, buf); } else { error = statfs_by_dentry(path->dentry, buf); }'

          check_and_fix('./fs/statfs.c', old_statfs, new_statfs, "statfs_by_dentry path fix")
          PYEOF
          cd "$WORKDIR"

          # --- 5. Append KSU + SUSFS config to gki_defconfig ---
          echo "=== Appending KSU/SUSFS config ==="
          cd common
          cat >> arch/arm64/configs/gki_defconfig << 'CONFIGEOF'

          # SukiSU Ultra
          CONFIG_KSU=y
          CONFIG_KPM=n
          # SUSFS
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=n
          # Filesystem
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIGEOF
          echo "Config appended to gki_defconfig"

          echo "=== Verify defconfig tail ==="
          tail -20 arch/arm64/configs/gki_defconfig
          cd "$WORKDIR"

          # --- 6. Summary ---
          echo ""
          echo "=== Integration summary ==="
          echo "SukiSU Ultra: builtin branch"
          echo "SUSFS: gki-android16-6.12 @ $SUSFS_SHA"
          echo "KPM: disabled (CONFIG_KPM=n)"
          echo "BBG: not installed"
          echo "Stealth patches: none (Build 3)"
          echo "Performance tuning: none"
          df -h /

      - name: Build kernel
        run: |
          set -euo pipefail
          cd "$WORKDIR/common"

          export TZ=UTC
          export LC_ALL=C
          export SOURCE_DATE_EPOCH=1717397200
          export KBUILD_BUILD_TIMESTAMP="$(date -u -d @$SOURCE_DATE_EPOCH '+%a %b %e %T UTC %Y')"
          export KBUILD_BUILD_USER=build-user
          export KBUILD_BUILD_HOST=build-host
          export KBUILD_BUILD_VERSION=1
          export KBUILD_GENDWARFKSYMS_STABLE=1
          export LIBCLANG_PATH="$WORKDIR/clang19/lib"

          echo "=== Build environment ==="
          echo "KBUILD_GENDWARFKSYMS_STABLE=$KBUILD_GENDWARFKSYMS_STABLE"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          echo "KBUILD_BUILD_TIMESTAMP=$KBUILD_BUILD_TIMESTAMP"

          ROOT_REAL_PATH="$WORKDIR"
          MAP_FLAGS="-fdebug-prefix-map=$ROOT_REAL_PATH=. -fmacro-prefix-map=$ROOT_REAL_PATH=. -ffile-prefix-map=$ROOT_REAL_PATH=."

          KCFLAGS="$MAP_FLAGS -no-canonical-prefixes -Wno-error -D__ANDROID_COMMON_KERNEL__"
          KCPPFLAGS="$MAP_FLAGS -D__ANDROID_COMMON_KERNEL__"

          MAKE_ARGS=(
            LLVM=1
            LLVM_IAS=1
            ARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu-
            CC="clang"
            LD="ld.lld"
            AR="llvm-ar"
            NM="llvm-nm"
            OBJCOPY="llvm-objcopy"
            OBJDUMP="llvm-objdump"
            STRIP="llvm-strip"
            HOSTCC="clang"
            HOSTCXX="clang++"
            HOSTLD="ld.lld"
            KCFLAGS="$KCFLAGS"
            KCPPFLAGS="$KCPPFLAGS"
          )

          command -v rustc &>/dev/null && MAKE_ARGS+=(RUSTC="$(command -v rustc)")
          command -v bindgen &>/dev/null && MAKE_ARGS+=(BINDGEN="$(command -v bindgen)")
          command -v pahole &>/dev/null && MAKE_ARGS+=(PAHOLE="$(command -v pahole)")

          echo "=== Build start: $(date -u) ==="

          make -j"$(nproc)" O=out "${MAKE_ARGS[@]}" gki_defconfig

          make O=out "${MAKE_ARGS[@]}" rustavailable || { echo "FATAL: Rust toolchain check failed"; exit 1; }

          make -j"$(nproc)" O=out "${MAKE_ARGS[@]}" olddefconfig

          # Enforce required base config (same as Build 1)
          REQUIRED=(
            "CONFIG_MODULES=y"
            "CONFIG_MODVERSIONS=y"
            "CONFIG_GENDWARFKSYMS=y"
            "CONFIG_RUST=y"
            "CONFIG_DEBUG_INFO_BTF=y"
          )
          for symbol in "${REQUIRED[@]}"; do
            grep -qx "$symbol" out/.config || { echo "FATAL: missing $symbol"; exit 1; }
          done

          # Enforce KSU + SUSFS present
          grep -qx "CONFIG_KSU=y" out/.config || { echo "FATAL: CONFIG_KSU=y not in built config"; exit 1; }
          grep -qx "CONFIG_KSU_SUSFS=y" out/.config || { echo "FATAL: CONFIG_KSU_SUSFS=y not in built config"; exit 1; }

          # Enforce KPM disabled
          if grep -qx "CONFIG_KPM=y" out/.config; then
            echo "FATAL: CONFIG_KPM=y found — must be disabled"
            exit 1
          fi

          echo "=== KSU/SUSFS config in built .config ==="
          grep -E '^CONFIG_KSU|^CONFIG_KPM|^CONFIG_KSU_SUSFS' out/.config || true
          echo "Config validated"

          KERNELRELEASE=$(make -s O=out "${MAKE_ARGS[@]}" kernelrelease)
          echo "=== Kernel release: $KERNELRELEASE ==="
          echo "=== Stock .300:     6.12.23-android16-5-gb2a876903b49-ab14541642-4k ==="
          echo "KERNELRELEASE=$KERNELRELEASE" >> "$GITHUB_ENV"

          make -j"$(nproc)" O=out "${MAKE_ARGS[@]}" Image 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" -eq 0 || { echo "FATAL: build failed"; grep -i "error:" build.log | tail -50; exit 1; }

          test -s out/arch/arm64/boot/Image || { echo "FATAL: Image not produced"; exit 1; }
          test -s out/vmlinux.symvers || { echo "FATAL: vmlinux.symvers missing"; exit 1; }

          echo "=== Build end: $(date -u) ==="
          IMAGE_SIZE=$(stat -c%s out/arch/arm64/boot/Image)
          echo "Image: $IMAGE_SIZE bytes"
          echo "Build 1 Image was: 40348160 bytes"

          # Size sanity: Build 2 should be larger than Build 1 (added KSU+SUSFS code)
          # but not absurdly so. Alert if smaller (code dropped) or >50% larger.
          if [ "$IMAGE_SIZE" -lt 39000000 ]; then
            echo "WARNING: Image significantly smaller than Build 1 — possible code drop"
          fi
          if [ "$IMAGE_SIZE" -gt 60000000 ]; then
            echo "WARNING: Image significantly larger than expected"
          fi

          sha256sum out/arch/arm64/boot/Image
          df -h /

      - name: Collect artifacts
        run: |
          set -euo pipefail
          cd "$WORKDIR/common"
          mkdir -p "$WORKDIR/artifacts"

          cp out/arch/arm64/boot/Image "$WORKDIR/artifacts/"
          cp out/.config "$WORKDIR/artifacts/kernel_built_config"
          cp out/vmlinux.symvers "$WORKDIR/artifacts/"
          cp out/System.map "$WORKDIR/artifacts/" 2>/dev/null || true
          cp out/modules.builtin "$WORKDIR/artifacts/" 2>/dev/null || true
          cp out/modules.builtin.modinfo "$WORKDIR/artifacts/" 2>/dev/null || true
          tail -500 build.log > "$WORKDIR/artifacts/build_tail.log"

          SUSFS_VER=$(grep -oP 'SUSFS_VERSION\s+"[^"]+"' include/linux/susfs.h 2>/dev/null | head -1 || echo "unknown")

          cat > "$WORKDIR/artifacts/BUILD_INFO.txt" << INFOEOF
          Source: ${{ env.SOURCE_REPO }}
          Branch: ${{ env.SOURCE_BRANCH }}
          Commit: ${{ env.SOURCE_SHA }}
          Kernelrelease: ${{ env.KERNELRELEASE }}
          Stock .300: 6.12.23-android16-5-gb2a876903b49-ab14541642-4k
          Clang: $(clang --version | head -1)
          Rustc: $(rustc --version 2>/dev/null)
          KBUILD_GENDWARFKSYMS_STABLE: 1
          Image size: $(stat -c%s "$WORKDIR/artifacts/Image") bytes
          Build date: $(date -u)
          Method: make gki_defconfig + make Image (direct GKI)
          SukiSU: Ultra builtin
          SUSFS: $SUSFS_VER
          KPM: disabled
          BBG: not installed
          INFOEOF

          cd "$WORKDIR/artifacts"
          sha256sum * | tee SHA256SUMS.txt
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: op15-build2-sukisu-kernel
          path: ${{ github.workspace }}/kernel_workspace/artifacts/*
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: op15-build2-full-log
          path: ${{ github.workspace }}/kernel_workspace/common/build.log
          retention-days: 14
          if-no-files-found: warn
