name: OnePlus 15 Build 1 — Stock-equivalent base kernel

# Build 1: Official OnePlus 15 source, canoe perf config.
# No SukiSU, SUSFS, KPM, stealth patches, or performance tuning.
# Purpose: prove source, toolchain, KMI, vendor modules, packaging.
#
# Sync method: archive download (no repo sync).
# Parses official oneplus_15.xml, downloads each project as tarball,
# extracts to correct paths. Handles GitHub, CLO, and googlesource remotes.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Disk cleanup
        run: |
          echo "=== Before cleanup ==="
          df -h /
          mkdir -p /tmp/.background_trash/{1..10}
          safe_mv() { [ -e "$1" ] && sudo mv "$1" "$2"; }
          export -f safe_mv
          safe_mv /usr/share/dotnet /tmp/.background_trash/1 &
          safe_mv /usr/local/lib/android /tmp/.background_trash/2 &
          safe_mv /opt/ghc /tmp/.background_trash/3 &
          safe_mv /opt/hostedtoolcache/CodeQL /tmp/.background_trash/4 &
          safe_mv /usr/local/share/chromium /tmp/.background_trash/5 &
          safe_mv /usr/local/share/powershell /tmp/.background_trash/6 &
          safe_mv /opt/hostedtoolcache/go /tmp/.background_trash/7 &
          safe_mv /opt/hostedtoolcache/PyPy /tmp/.background_trash/8 &
          safe_mv /opt/hostedtoolcache/node /tmp/.background_trash/9 &
          sudo bash -c 'mv /usr/local/julia* /tmp/.background_trash/10 2>/dev/null || true' &
          wait
          (
            sudo nice -n 19 ionice -c 3 rm -rf /tmp/.background_trash
            sudo apt-get purge -y firefox google-chrome-stable microsoft-edge-stable > /dev/null 2>&1 || true
            sudo docker image prune --all --force > /dev/null 2>&1 || true
          ) > /dev/null 2>&1 &
          disown
          echo "=== After cleanup ==="
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl flex git \
            kmod libelf-dev libssl-dev lz4 python3 python-is-python3 \
            zip zstd rsync ccache aria2 pigz
          echo "aria2 version: $(aria2c --version | head -1)"

      - name: Download manifest and sync source via archives
        env:
          MANIFEST_URL: "https://raw.githubusercontent.com/OnePlusOSS/kernel_manifest/refs/heads/oneplus/sm8850/oneplus_15.xml"
        run: |
          mkdir -p op15-kernel && cd op15-kernel

          echo "=== Downloading official manifest ==="
          curl --fail --show-error -L "$MANIFEST_URL" -o manifest.xml
          echo "Manifest downloaded. Contents:"
          cat manifest.xml

          echo ""
          echo "=== Syncing source via archive downloads ==="

          python3 << 'PYEOF'
          import xml.etree.ElementTree as ET
          import subprocess
          import os, shutil, time, glob
          from concurrent.futures import ThreadPoolExecutor

          NPROC = int(subprocess.check_output("nproc", shell=True).strip())
          MAX_WORKERS = (os.cpu_count() or 2) * 4

          aria2_headers = (
              "--header='User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36' "
              "--header='Accept: */*' "
              "--header='Connection: keep-alive' "
          )

          def sync_project(task):
              name, path, url, strip, rev = task
              if path not in ["./", "."]:
                  os.makedirs(path, exist_ok=True)

              start_time = time.time()
              MAX_ATTEMPTS = 3
              for attempt in range(1, MAX_ATTEMPTS + 1):
                  shm_workspace = f"/dev/shm/sync_{hash(name) % 1000000}"
                  if os.path.exists(shm_workspace):
                      shutil.rmtree(shm_workspace, ignore_errors=True)
                  os.makedirs(shm_workspace, exist_ok=True)

                  print(f"  [{attempt}/{MAX_ATTEMPTS}] {name} -> {path}")
                  try:
                      archive_file = "source.tar.gz"
                      archive_path = os.path.join(shm_workspace, archive_file)
                      aria_cmd = (
                          f"aria2c -x16 -s16 -k1M -j16 --allow-overwrite=true "
                          f"--retry-wait=5 --max-tries=10 "
                          f"-d {shm_workspace} -o {archive_file} "
                          f"--summary-interval=0 {aria2_headers} '{url}'"
                      )
                      subprocess.run(aria_cmd, shell=True, check=True, capture_output=True)

                      extract_cmd = (
                          f"tar -I 'pigz -p {NPROC}' -x "
                          f"-f {archive_path} -C {path} {strip}"
                      )
                      subprocess.run(extract_cmd, shell=True, check=True)

                      duration = time.time() - start_time
                      print(f"  [OK] {name} ({duration:.1f}s)")
                      return True
                  except subprocess.CalledProcessError as e:
                      stderr = e.stderr.decode() if e.stderr else "no stderr"
                      print(f"  [FAIL] {name} attempt {attempt}: {stderr[:200]}")
                      if attempt < MAX_ATTEMPTS:
                          time.sleep(5)
                  finally:
                      if os.path.exists(shm_workspace):
                          shutil.rmtree(shm_workspace, ignore_errors=True)
              print(f"  [FATAL] {name} failed all {MAX_ATTEMPTS} attempts")
              return False

          global_start = time.time()

          with open("manifest.xml", "r") as f:
              manifest_content = f.read()

          root = ET.fromstring(manifest_content)
          top_dir = os.getcwd()

          remotes = {r.get("name"): r.get("fetch").rstrip("/") for r in root.findall("remote")}
          default = root.find("default")
          def_remote = default.get("remote") if default is not None else None
          def_rev = default.get("revision") if default is not None else None

          # Host-side test infrastructure — not on CLO (404), not needed for kernel build
          SKIP_PROJECTS = {
              "kernel_platform/prebuilts/asuite",
              "kernel_platform/tools/tradefederation/prebuilts",
          }

          sync_tasks = []
          post_process_data = []

          for project in root.findall("project"):
              name = project.get("name")
              path = project.get("path", name)
              remote_name = project.get("remote", def_remote)
              rev = project.get("revision", def_rev)
              base_url = remotes.get(remote_name)

              if not base_url:
                  continue

              if name in SKIP_PROJECTS:
                  print(f"  [SKIP] {name} (host-side test infra, not on CLO)")
                  continue

              if "github.com" in base_url:
                  url = f"{base_url}/{name}/archive/{rev}.tar.gz"
                  strip = "--strip-components=1"
              elif "googlesource.com" in base_url:
                  url = f"{base_url}/{name}/+archive/{rev}.tar.gz"
                  strip = ""
              elif "git.codelinaro.org" in base_url:
                  url = f"{base_url}/{name}/-/archive/{rev}.tar.gz"
                  strip = "--strip-components=1"
              else:
                  print(f"  [SKIP] Unknown remote for {name}: {base_url}")
                  continue

              sync_tasks.append((name, path, url, strip, rev))

              for child in project:
                  if child.tag in ["linkfile", "copyfile"]:
                      post_process_data.append((path, child))

          print(f"Syncing {len(sync_tasks)} projects in parallel...")
          with ThreadPoolExecutor(max_workers=MAX_WORKERS) as executor:
              success_list = list(executor.map(sync_project, sync_tasks))

              if not all(success_list):
                  failed = [sync_tasks[i][0] for i, ok in enumerate(success_list) if not ok]
                  print(f"\nFATAL: {len(failed)} projects failed: {failed}")
                  exit(1)

          print("\nProcessing linkfiles and copyfiles...")
          for path, child in post_process_data:
              src_rel = child.get("src")
              dest_rel = child.get("dest")
              if not src_rel or not dest_rel:
                  continue

              src_path = os.path.join(top_dir, path, src_rel)
              dest_path = os.path.join(top_dir, dest_rel)
              os.makedirs(os.path.dirname(dest_path), exist_ok=True)

              if child.tag == "linkfile":
                  if os.path.lexists(dest_path):
                      os.remove(dest_path)
                  rel_target = os.path.relpath(src_path, os.path.dirname(dest_path))
                  os.symlink(rel_target, dest_path)
                  print(f"  [Link] {dest_rel} -> {src_rel}")
              elif child.tag == "copyfile":
                  shutil.copy2(src_path, dest_path)
                  print(f"  [Copy] {dest_rel} from {src_rel}")

          total_duration = time.time() - global_start
          minutes = int(total_duration // 60)
          seconds = total_duration % 60
          print(f"\nSync completed in {minutes}m {seconds:.2f}s")
          PYEOF

          echo ""
          echo "=== Verify tree structure ==="
          ls -la
          echo ""
          echo "=== Build script present ==="
          ls -la kernel_platform/oplus/build/oplus_build_kernel.sh || { echo "ERROR: build script not found"; find . -name "oplus_build_kernel.sh" 2>/dev/null; exit 1; }
          echo ""
          echo "=== kernel_platform contents ==="
          ls kernel_platform/
          echo ""
          echo "=== Symlinks ==="
          find . -maxdepth 3 -type l -ls 2>/dev/null | head -20
          echo ""
          df -h /

      - name: Initialize git repos (Bazel workspace status needs .git)
        run: |
          cd op15-kernel
          for dir in . kernel_platform/common kernel_platform/soc-repo; do
            if [ -d "$dir" ] && [ ! -d "$dir/.git" ]; then
              git -C "$dir" init -q
              git -C "$dir" add -A > /dev/null 2>&1 || true
              git -C "$dir" -c user.email=ci@build -c user.name=CI commit -q -m "source" --allow-empty
              echo "git init: $dir"
            fi
          done

      - name: Verify source integrity
        run: |
          cd op15-kernel
          echo "=== Verify no SukiSU/SUSFS/KPM in source ==="
          FOUND=0
          for pattern in CONFIG_KSU CONFIG_KPM SUSFS KernelSU SukiSU; do
            COUNT=$(grep -r "$pattern" kernel_platform/common/fs/ kernel_platform/common/kernel/ kernel_platform/common/security/ 2>/dev/null | wc -l)
            if [ "$COUNT" -gt 0 ]; then
              echo "WARNING: $pattern found $COUNT times"
              FOUND=1
            fi
          done
          [ "$FOUND" -eq 0 ] && echo "Source clean: no root framework references"

      - name: Build kernel (canoe perf)
        run: |
          cd op15-kernel
          chmod +x kernel_platform/oplus/build/*.sh
          echo "=== Build start: $(date -u) ==="
          ./kernel_platform/oplus/build/oplus_build_kernel.sh canoe perf 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo ""
          echo "=== Build exit code: $BUILD_EXIT ==="
          echo "=== Build end: $(date -u) ==="
          echo ""
          echo "=== Searching for kernel image ==="
          find kernel_platform/out -name 'Image' -o -name 'Image.gz' -o -name 'Image.lz4' -o -name 'Image.gz-dtb' 2>/dev/null | head -10
          echo ""
          DIST=$(find kernel_platform/out -type d -name 'dist' | head -1)
          if [ -n "$DIST" ]; then
            echo "=== Dist contents ==="
            ls -la "$DIST/"
          fi
          df -h /
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo ""
            echo "=== BUILD FAILED — last 50 errors ==="
            grep -i "error\|fatal\|failed\|undefined\|cannot" build.log | tail -50
            exit $BUILD_EXIT
          fi

      - name: Collect build artifacts
        run: |
          cd op15-kernel
          mkdir -p artifacts

          for name in Image Image.gz Image.lz4 Image.gz-dtb; do
            IMG=$(find kernel_platform/out -name "$name" -not -path "*/dts/*" | head -1)
            if [ -n "$IMG" ]; then
              echo "Found: $IMG ($(stat -c%s "$IMG") bytes)"
              cp "$IMG" artifacts/
            fi
          done

          CONF=$(find kernel_platform/out -name '.config' | head -1)
          if [ -n "$CONF" ]; then
            cp "$CONF" artifacts/kernel_built_config
            echo "=== Config verification ==="
            grep -E '^CONFIG_LOCALVERSION' "$CONF" || echo "LOCALVERSION not set"
            grep -E '^CONFIG_MODULES=|^CONFIG_MODVERSIONS=' "$CONF" || true
            echo "--- Verify NO root framework ---"
            grep -E 'CONFIG_KSU|CONFIG_KPM|SUSFS' "$CONF" && echo "ERROR: root config in build" || echo "Clean"
          fi

          find kernel_platform/out -name 'Module.symvers' -exec cp {} artifacts/ \; 2>/dev/null || true
          find kernel_platform/out -name '*.dtb' -not -path "*/dts/*" | head -5 | while read dtb; do
            cp "$dtb" artifacts/ 2>/dev/null || true
          done

          tail -500 build.log > artifacts/build_tail.log 2>/dev/null || true

          cd artifacts
          sha256sum * 2>/dev/null | tee SHA256SUMS.txt
          ls -la

      - name: Verify kernel image produced
        run: |
          cd op15-kernel/artifacts
          ls Image Image.gz Image.lz4 Image.gz-dtb 2>/dev/null || {
            echo "ERROR: No kernel image produced — Build 1 FAILED"
            grep -i "error\|fatal\|failed" ../build.log | tail -30
            exit 1
          }
          echo "Build 1 kernel image present"

      - name: Upload Build 1 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: op15-build1-base-kernel
          path: op15-kernel/artifacts/*
          retention-days: 30
          if-no-files-found: error

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: op15-build1-full-log
          path: op15-kernel/build.log
          retention-days: 14
          if-no-files-found: warn
